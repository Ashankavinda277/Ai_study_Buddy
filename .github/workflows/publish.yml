name: Publish images

# Builds both images and pushes them to GitHub Container Registry (ghcr.io)
# on every green push to main. Any host that can pull a container -- Render,
# Railway, Fly, a plain VPS -- can then deploy these tags, so this stays useful
# whichever platform you settle on.
#
# Images land at:
#   ghcr.io/<owner>/<repo>-backend:main
#   ghcr.io/<owner>/<repo>-frontend:main
#
# They inherit the repository's visibility. If the repo is private the host
# will need a pull token; make the package public from the repo's Packages tab
# if you would rather not manage one.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically by Actions -- no secret to configure.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image prefix
        id: name
        # ghcr.io rejects uppercase in image names, and GitHub usernames and
        # repositories frequently contain it.
        run: echo "prefix=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.name.outputs.prefix }}-backend:main
            ghcr.io/${{ steps.name.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Baked into the client bundle at build time, so the deployed API URL
          # has to be known here. Change this to your real backend URL, or move
          # it to a repository variable (vars.API_URL) once you have one.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          tags: |
            ghcr.io/${{ steps.name.outputs.prefix }}-frontend:main
            ghcr.io/${{ steps.name.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
