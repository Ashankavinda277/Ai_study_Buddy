services:
  postgres:
    image: postgres:17
    container_name: ai-study-buddy-postgres
    restart: always
    environment:
      POSTGRES_DB: ai_study_buddy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: