services:
  postgres:
    image: postgres:16
    container_name: study_buddy_db
    restart: always
    environment:
      POSTGRES_DB: study_buddy_db
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: studybuddy_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma
    container_name: study_buddy_chroma
    restart: always
    ports:
      - "8001:8000"
    volumes:
      # chromadb persists to /data -- mounting anywhere else (e.g. /chroma/chroma)
      # leaves the data in the container's ephemeral layer, so every recreate
      # silently wipes all embeddings.
      - chromadata:/data

volumes:
  pgdata:
  chromadata:
